<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre-se</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div class="container">
        <div class="row gy-2 gx-3 justify-content-center">
            <div class="col-sm-4">
                <h1 class="text-center">Registro</h1>
                <form>
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingInput" placeholder="Nome">
                        <label for="floatingInput">Nome Completo:</label>
                    </div>
                    
                    <div class="form-floating mb-3">
                        <input id="floatingInputValue" type="email" class="form-control" placeholder="nome@exemplo.com"
                            value="exemplo@exemplo.com">
                        <label for="floatingInputValue">Seu email:</label>
                    </div>
                    <label for="mensagem" class="form-label">Mensagem:</label>
                    <textarea id="mensagem" class="form-control"></textarea>
                    <div class="form-check form-switch">
                        <label for="aceito-termos" class="form-check-label">De acordo!</label>
                        <input type="checkbox" class="form-check-input" id="aceito-termos">
                    </div>
                    <div class="d-grid gap-2 col-6 mx-auto"><button class="btn btn-primary shadow-3">Registrar</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</body>

</html>
